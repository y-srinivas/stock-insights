<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Local Agent Test</title>
    <style>
      :root {
        --bg: #0b1220;
        --panel: #111b2d;
        --panel-alt: #172742;
        --primary: #3b82f6;
        --text: #edf4ff;
        --muted: #b2c4df;
        --border: rgba(255, 255, 255, 0.12);
        --danger: #ef4444;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, sans-serif;
        background: linear-gradient(140deg, #09111d, #111b2d 45%, #0f172a);
        color: var(--text);
        min-height: 100vh;
      }

      .shell {
        max-width: 1080px;
        margin: 0 auto;
        padding: 24px;
        display: grid;
        gap: 18px;
      }

      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 16px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 1.4rem;
      }

      p {
        margin: 0;
        color: var(--muted);
      }

      .form-grid {
        display: grid;
        gap: 12px;
      }

      label {
        display: block;
        margin-bottom: 6px;
        font-size: 0.85rem;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }

      input,
      textarea {
        width: 100%;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.03);
        color: var(--text);
        border-radius: 10px;
        padding: 10px 12px;
        font-size: 0.98rem;
      }

      textarea {
        min-height: 94px;
        resize: vertical;
      }

      .actions {
        display: flex;
        gap: 10px;
      }

      button {
        border: 0;
        border-radius: 10px;
        padding: 11px 16px;
        font-weight: 600;
        cursor: pointer;
      }

      .primary {
        background: var(--primary);
        color: white;
      }

      .secondary {
        background: rgba(255, 255, 255, 0.1);
        color: var(--text);
      }

      .status {
        font-size: 0.9rem;
        color: var(--muted);
      }

      .status.error {
        color: #fecaca;
      }

      .split {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }

      .pane-title {
        margin: 0 0 8px;
        color: var(--muted);
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .rendered {
        min-height: 220px;
        background: var(--panel-alt);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 12px;
        overflow-x: auto;
      }

      pre {
        margin: 0;
        min-height: 220px;
        background: var(--panel-alt);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 12px;
        color: #dbeafe;
        overflow-x: auto;
        white-space: pre-wrap;
        word-break: break-word;
      }

      .hint {
        font-size: 0.85rem;
        color: var(--muted);
      }

      @media (max-width: 900px) {
        .split {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <section class="card">
        <h1>Local Agent Test</h1>
        <p>Use this page to test /api/chat returning text/html and verify rendered output instantly.</p>
      </section>

      <section class="card form-grid">
        <div>
          <label for="symbol">Symbol hint</label>
          <input id="symbol" type="text" value="AAPL" maxlength="15" />
        </div>

        <div>
          <label for="message">Message</label>
          <textarea id="message">Give me a concise outlook for Apple with key risks.</textarea>
        </div>

        <div class="actions">
          <button id="send" class="primary" type="button">Send Request</button>
          <button id="clear" class="secondary" type="button">Clear Output</button>
        </div>

        <div id="status" class="status">Ready</div>
        <div class="hint">Endpoint: POST /api/chat with Accept: text/html</div>
      </section>

      <section class="split">
        <div class="card">
          <h2 class="pane-title">Rendered HTML</h2>
          <div id="rendered" class="rendered"></div>
        </div>

        <div class="card">
          <h2 class="pane-title">Raw Response</h2>
          <pre id="raw"></pre>
        </div>
      </section>
    </div>

    <script>
      const symbolInput = document.getElementById("symbol");
      const messageInput = document.getElementById("message");
      const sendButton = document.getElementById("send");
      const clearButton = document.getElementById("clear");
      const status = document.getElementById("status");
      const rendered = document.getElementById("rendered");
      const raw = document.getElementById("raw");

      function setStatus(text, isError = false) {
        status.textContent = text;
        status.classList.toggle("error", isError);
      }

      async function sendRequest() {
        const message = messageInput.value.trim();
        const symbol = symbolInput.value.trim().toUpperCase();

        if (!message) {
          setStatus("Message is required.", true);
          return;
        }

        sendButton.disabled = true;
        setStatus("Sending request...");

        try {
          const response = await fetch("/api/chat", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Accept: "text/html",
            },
            body: JSON.stringify({ symbol, message }),
          });

          const text = await response.text();
          raw.textContent = text;

          if (!response.ok) {
            rendered.innerHTML = "";
            setStatus(`Request failed (${response.status}): ${text}`, true);
            return;
          }

          rendered.innerHTML = text;
          setStatus(`Success (${response.status})`);
        } catch (error) {
          rendered.innerHTML = "";
          raw.textContent = String(error && error.message ? error.message : error);
          setStatus("Network error while calling /api/chat.", true);
        } finally {
          sendButton.disabled = false;
        }
      }

      function clearOutput() {
        rendered.innerHTML = "";
        raw.textContent = "";
        setStatus("Cleared");
      }

      sendButton.addEventListener("click", sendRequest);
      clearButton.addEventListener("click", clearOutput);
    </script>
  </body>
</html>
